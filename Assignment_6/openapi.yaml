openapi: 3.0.3
info:
  title: Kisan Mitra Orders Service API
  version: 1.0.0
  description: Official REST API contract for Kisan Mitra agricultural marketplace orders service, supporting CS543 Assignments 4, 5, and 6.

servers:
  - url: http://localhost:5000
    description: Local development server

paths:
  /orders:
    post:
      summary: Place a new produce order
      description: Creates a new order for agricultural produce. Made safely retryable via the Idempotency-Key header.
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: Unique client key preventing duplicate orders upon retrying.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created successfully.
          headers:
            Location:
              schema:
                type: string
              description: URI of the newly created order resource.
            ETag:
              schema:
                type: string
              description: Entity tag representing the current version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
            application/xml:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Malformed JSON body or invalid syntax.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid Bearer authorization token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Produce item unavailable / out of stock.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Request body failed field-level schema validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Per-client rate limit budget exceeded.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    get:
      summary: List and filter orders
      description: Returns a filtered list of orders without mutating resource state.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, confirmed, processing, shipped, delivered, cancelled]
          description: Filter orders by current operational status.
      responses:
        '200':
          description: List of matching orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
            application/xml:
              schema:
                $ref: '#/components/schemas/OrderList'

  /orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Unique order identifier.

    get:
      summary: Read single order representation
      description: Retrieves the order representation. Supports conditional reading via the If-None-Match header.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: Client-cached ETag. Returns 304 if unchanged.
      responses:
        '200':
          description: Order details.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
            application/xml:
              schema:
                $ref: '#/components/schemas/Order'
        '304':
          description: Resource has not changed since the client last fetched it.
        '404':
          description: Order with given ID does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '406':
          description: Requested Accept header representation is not supported.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    patch:
      summary: Partially modify order details
      description: Modifies order fields. Requires an If-Match header to prevent lost updates.
      security:
        - BearerAuth: []
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
          description: Current resource ETag required to prevent overwrite collisions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchOrderRequest'
      responses:
        '200':
          description: Order modified successfully.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized caller.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Order not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Order in illegal status for updates.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '412':
          description: Precondition Failed. Target resource has been modified.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Invalid patch field values.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '428':
          description: Precondition Required. If-Match header was not provided.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    delete:
      summary: Remove an order
      description: Permanently removes the order.
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Order removed successfully. No content returned.
        '401':
          description: Unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Order not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

    options:
      summary: Discover allowed methods on resource
      responses:
        '204':
          description: Metadata discovery response.
          headers:
            Allow:
              schema:
                type: string
              example: GET, POST, PATCH, DELETE, OPTIONS

  /orders/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Cancel an existing order
      description: Non-CRUD state transition. Returns 202 Accepted initially and 200 OK on repeated calls.
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '202':
          description: Cancellation accepted for processing.
          content:
            application/json:
              schema:
                type: object
        '200':
          description: Order was already cancelled previously (idempotent retry).
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized caller.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Order not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Order is already shipped or delivered and cannot be cancelled.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    OrderItem:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: string
          example: PROD-WHEAT-01
        quantity:
          type: integer
          minimum: 1
          example: 10
        pricePerKg:
          type: number
          format: float
          example: 35.00
        itemTotal:
          type: string
          example: "350.00"

    CreateOrderRequest:
      type: object
      required:
        - deliveryAddress
        - items
      properties:
        buyerId:
          type: string
          example: BUYER-01
        deliveryAddress:
          type: string
          minLength: 5
          example: APMC Market Yard Gate 2, Surat, Gujarat
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'

    PatchOrderRequest:
      type: object
      properties:
        deliveryAddress:
          type: string
          minLength: 5
          example: Updated Warehouse 4B, Mehsana, Gujarat
        status:
          type: string
          enum: [pending, confirmed, processing, shipped, delivered, cancelled]

    Order:
      type: object
      required:
        - id
        - buyerId
        - items
        - totalAmount
        - deliveryAddress
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          example: "101"
        buyerId:
          type: string
          example: BUYER-01
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        totalAmount:
          type: number
          format: float
          example: 650.00
        deliveryAddress:
          type: string
          example: APMC Market Yard Gate 2, Surat, Gujarat
        status:
          type: string
          example: pending
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        cancellationReason:
          type: string

    OrderList:
      type: array
      items:
        $ref: '#/components/schemas/Order'

    ValidationError:
      type: object
      properties:
        field:
          type: string
          example: items[0].quantity
        message:
          type: string
          example: Quantity must be a positive integer greater than or equal to 1.

    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          example: https://kisanmitra.in/errors/validation-error
        title:
          type: string
          example: Validation Failed
        status:
          type: integer
          example: 422
        detail:
          type: string
          example: The submitted order payload failed field-level schema validation.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
